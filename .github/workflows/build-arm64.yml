# 两阶段原生构建 RAGFlow ARM64 镜像，并推送到 GHCR。
# 放置位置：fork 仓库根目录下  .github/workflows/build-arm64.yml
# 原理：
#   1) Dockerfile_base 从 ubuntu:24.04 构建 ragflow-base（含 texlive/依赖/模型）→ 推 GHCR
#   2) 把主 Dockerfile 的 FROM infiniflow/ragflow-base:v2.1 改指向 GHCR 上的 arm64 base
#   3) 构建主 Dockerfile → 推 GHCR
# runner 本身是 arm64，无需 --platform、无需 QEMU。

name: Build RAGFlow ARM64 image

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 小写化 owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 buildx
        uses: docker/setup-buildx-action@v3

      - name: 1) 构建 ragflow-base（arm64）→ GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_base
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/ragflow-base:v2.1
          build-args: |
            NEED_MIRROR=0
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: 2) 把主 Dockerfile 的 FROM 指向 GHCR base
        run: sed -i 's|infiniflow/ragflow-base:v2.1|ghcr.io/${{ steps.owner.outputs.name }}/ragflow-base:v2.1|g' Dockerfile

      - name: 3) 构建 ragflow 主镜像（arm64）→ GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/ragflow:arm64
            ghcr.io/${{ steps.owner.outputs.name }}/ragflow:arm64-${{ github.sha }}
          build-args: |
            NEED_MIRROR=0
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
