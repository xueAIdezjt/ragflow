# 在 GitHub 免费 arm64 runner 上原生构建 RAGFlow ARM64 镜像，并推送到 GHCR。
# 放置位置：fork 的仓库根目录下  .github/workflows/build-arm64.yml
# 触发方式：GitHub 仓库的 Actions 页 → 选这个 workflow → Run workflow（手动）。

name: Build RAGFlow ARM64 image

on:
  workflow_dispatch: {}          # 手动触发，按需构建

jobs:
  build-and-push:
    # GitHub 标准 arm64 runner。仓库保持 public 即可免费、不限时长。
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write            # 推送到 GHCR 需要

    steps:
      - name: Checkout（含完整 git 历史，Dockerfile 要用 git describe 取版本号）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 小写化 owner（GHCR 镜像名必须全小写）
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR（GITHUB_TOKEN 自动提供，无需自己建 secret）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 buildx
        uses: docker/setup-buildx-action@v3

      - name: 原生构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # runner 本身是 arm64，不需要 --platform、不需要 QEMU
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/ragflow:arm64
            ghcr.io/${{ steps.owner.outputs.name }}/ragflow:arm64-${{ github.sha }}
          # 用 GitHub Actions 缓存层，失败重跑更快
          cache-from: type=gha
          cache-to: type=gha,mode=max
